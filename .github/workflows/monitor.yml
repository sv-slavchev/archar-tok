name: Проверка за прекъсвания

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Проверка на сайта
        run: python monitor.py
      - name: Отчет
        run: python report.py
      - name: Запис на данните
        run: |
          git config user.name "outage-bot"
          git config user.email "outage-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Проверка $(TZ=Europe/Sofia date '+%d.%m.%Y %H:%M')"
          git push
