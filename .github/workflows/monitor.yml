name: Проверка за прекъсвания

on:
  schedule:
    - cron: "7,37 * * * *"     # редовна проверка на всеки 30 минути
    - cron: "22,52 * * * *"    # допълнителна — само докато тече прекъсване (→ на всеки 15 мин)
  workflow_dispatch: {}         # ръчно пускане от раздел Actions

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Проверка на сайта
        id: mon
        run: |
          if [ "${{ github.event.schedule }}" = "22,52 * * * *" ]; then
            python monitor.py --if-open
          else
            python monitor.py
          fi
      - name: Отчет
        if: steps.mon.outputs.skipped != 'true'
        run: python report.py
      - name: Запис на данните
        if: steps.mon.outputs.skipped != 'true'
        run: |
          git config user.name "outage-bot"
          git config user.email "outage-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Проверка $(TZ=Europe/Sofia date '+%d.%m.%Y %H:%M')"
          git push
