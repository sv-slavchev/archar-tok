name: Проверка за прекъсвания

on:
  # Основният таймер е външен (cron-job.org) — пуска това на всеки 15 мин с mode=auto.
  # Графикът на GitHub остава само като резерва (той често закъснява с часове).
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = пропусни, ако няма прекъсване и е проверявано скоро; force = провери веднага"
        default: "force"

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests shapely
      - name: Проверка на сайта
        id: mon
        run: |
          if [ "${{ inputs.mode }}" = "force" ]; then
            python monitor.py
          else
            python monitor.py --auto
          fi
      - name: Контур на селото и улици (само при нужда)
        if: steps.mon.outputs.skipped != 'true'
        run: python map_data.py --if-needed
      - name: Отчет
        if: steps.mon.outputs.skipped != 'true'
        run: python report.py
      - name: Запис на данните
        if: steps.mon.outputs.skipped != 'true'
        run: |
          git config user.name "outage-bot"
          git config user.email "outage-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Проверка $(TZ=Europe/Sofia date '+%d.%m.%Y %H:%M')"
          git push
